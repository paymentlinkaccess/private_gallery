<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery Feed | Admin</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./feed.css"></head><body><header><a class="logo" href="./index.html">PRIVATE<span>.</span></a><nav><a href="./daily.html">Daily Feed</a></nav></header><main><div class="eyebrow">PRIVATE DASHBOARD</div><h1>UPLOAD <em>STUDIO.</em></h1><section id="login"><h2>Admin sign in</h2><form id="signIn"><input type="email" id="email" placeholder="Admin email" required><button>Send sign-in link</button></form><div class="actions"><button type="button" id="signUp" class="secondary">Create account</button><button type="button" id="resetPassword" class="secondary">Reset password</button></div><p id="loginMessage" role="status"></p></section><section id="members" hidden><div class="actions"><span id="account"></span><button id="logout" class="secondary">Sign out</button></div><p id="memberStatus" role="status"></p><div id="adminFeedNav" hidden><a class="cta" href="./daily.html">View Daily Feed →</a></div><form id="uploadForm" hidden><label>Post title<input name="title" required maxlength="120"></label><label>Description<textarea name="description" maxlength="1000"></textarea></label><label>Category<select name="category"><option>Daily Updates</option><option>Behind the Scenes</option><option>Recently Added</option></select></label><label>Photo or video<input name="media" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" required></label><button id="publish">Upload and publish</button></form><p id="uploadStatus" role="status"></p></section></main><script type="module" src="./feed.js?v=20261015-5"></script></body></html>
